<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    ThaiLan 的 App 圖示。

    配色取自 frontend/src/styles.css 的既有變數，讓圖示與 App 內部
    是同一個視覺語言：
      底色   #0b100e（--ink-900，帶一點綠的近黑）
      金漸層 #e6c67e → #9a7b34（--gold-400 → --gold-600）

    漸層角度與畫面上按鈕的 linear-gradient(135deg, ...) 一致。

    字母是泰文的 ท（tho thahan）。選它的理由：筆畫簡單，
    縮到手機桌面的尺寸仍然看得清楚，而且一眼就知道跟泰文有關。
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c67e"/>
      <stop offset="100%" stop-color="#9a7b34"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0b100e"/>

  <!-- 細金框，呼應畫面上卡片的 1px 金色邊 -->
  <rect x="14" y="14" width="484" height="484" rx="96"
        fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.45"/>

  <text x="256" y="268"
        font-family="Leelawadee UI, Noto Sans Thai, Tahoma, sans-serif"
        font-size="300" font-weight="600" fill="url(#gold)"
        text-anchor="middle" dominant-baseline="central">ท</text>
</svg>

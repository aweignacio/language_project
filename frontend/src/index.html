<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>中泰翻譯查詢</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 瀏覽器網址列／手機狀態列跟著頁面用同一個深色，避免上方露出一條白邊 -->
  <meta name="theme-color" content="#0B100E">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    字型：三種文字各自交給合適的字體，不共用一套。
      Noto Serif TC   → 中文（標題與內文，襯線比黑體更有辭典感）
      Noto Serif Thai → 泰文（結果區的主角，字級拉大時筆畫才撐得住）
      IBM Plex Mono   → 羅馬拼音與小標籤（等寬字讓拼音好對照）
    先 preconnect 是讓瀏覽器提早把連線建好，字型晚一點才到、畫面不會空白。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Serif+TC:wght@400;500;600;700&amp;family=Noto+Serif+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">

  <!--
    iOS 專用的標籤。iPhone 的 Safari 對 manifest.webmanifest 只支援一部分，
    下面這幾行是它真正認得的，少了它們「加入主畫面」之後會變成：
      ・圖示變成網頁截圖，而不是我們設計的那個
      ・點開仍然帶著 Safari 的網址列，不是全螢幕
      ・桌面名稱抓 <title>「中泰翻譯查詢」，而不是 ThaiLan

    Android 走 manifest 就夠了，不需要這一段。
  -->
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ThaiLan">
  <!-- black-translucent 讓狀態列融進頁面的深色背景，不會浮一條灰帶 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>

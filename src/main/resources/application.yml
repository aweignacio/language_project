spring:
  application:
    name: language_project

  # 本機開發預設啟用 local profile。
  # 資料庫帳密與 API Key 寫在 application-local.yml，該檔已排除於版本控制之外。
  profiles:
    active: local

  datasource:
    hikari:
      # 容器剛啟動時，SQL Server 的使用者資料庫可能仍在恢復中而無法連線。
      # 給連線池一段重試時間，避免電腦開機後應用程式搶先連線導致啟動失敗。
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  ai:
    openai:
      chat:
        options:
          # 金鑰寫在 application-local.yml，不進版本控制。
          #
          # 為什麼不用便宜的 mini：2026-08-13 實測 gpt-4o-mini 翻泰文會翻一半停手，
          # 回出「ฉันอยาก吃ข้าว」這種中泰混雜的結果，逐詞拼音也會退回中文拼音。
          # 提示詞已寫得非常明確仍然如此，那是模型能力不足，不是講不清楚。
          # 泰文屬於相對冷門的語言，需要主力模型才撐得住。
          model: gpt-5.5
      audio:
        speech:
          # 語音設定採用扁平寫法。舊版的 audio.speech.options.* 巢狀形式已標記為棄用。
          model: gpt-4o-mini-tts
          voice: alloy
          response-format: mp3

  data:
    web:
      pageable:
        # 分頁回應改用穩定的 DTO 結構輸出。
        # 直接序列化 PageImpl 的話，Spring 會警告「JSON 結構不保證穩定」——
        # 意思是升級版本時欄位可能改變，而前端正是靠這個結構在讀資料。
        serialization-mode: via-dto

  jpa:
    # 關閉 Open Session In View，避免在 View 層觸發非預期的延遲查詢。
    # 本專案不使用 JPA 關聯註解，資料一律在 Service 層查詢完畢後轉為 DTO。
    open-in-view: false
    hibernate:
      # 資料表結構以 SQL 腳本明確管理，不交由 Hibernate 自動產生。
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

ai:
  pricing:
    openai:
      # 單位是「每一個 token 的美金價格」。
      # 官網公布的是「每 100 萬 token 多少錢」，填進來要除以 1,000,000。
      # 查證日期 2026-08-13，來源 developers.openai.com/api/docs/pricing
      #
      # gpt-5.5：輸入 $5.00 / 1M、輸出 $30.00 / 1M
      # ★ 換模型時這兩個數字一定要跟著改，否則帳面數字是錯的。
      #   （2026-08-13 之前這裡放的是計畫文件的佔位值 0.000005 / 0.000015，
      #     而當時實際用的 gpt-4o-mini 是 0.00000015 / 0.0000006，
      #     費用被高估了三十幾倍。）
      translation-input-price: 0.00000500
      translation-output-price: 0.00003000

      # gpt-4o-mini-tts：文字輸入 $0.60 / 1M token、語音輸出 $12.00 / 1M token。
      # ⚠ 我們的記帳是「按字元」算的，但 OpenAI 實際是「按 token」收費，
      #   而且主要成本在語音輸出那一段，我們現在量不到。
      #   所以語音的費用是粗估值，不是精確值。詳見計畫文件的已知偏離。
      speech-price: 0.00001500

audio:
  storage:
    # 音檔存放資料夾。已列入 .gitignore，不進版本控制。
    directory: audio

logging:
  level:
    root: info

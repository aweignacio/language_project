spring:
  application:
    name: language_project

  # 本機開發預設啟用 local profile。
  # 資料庫帳密與 API Key 寫在 application-local.yml，該檔已排除於版本控制之外。
  profiles:
    active: local

  datasource:
    hikari:
      # 容器剛啟動時，SQL Server 的使用者資料庫可能仍在恢復中而無法連線。
      # 給連線池一段重試時間，避免電腦開機後應用程式搶先連線導致啟動失敗。
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  ai:
    openai:
      chat:
        options:
          # 金鑰寫在 application-local.yml，不進版本控制。
          #
          # 為什麼不用便宜的 mini：2026-08-13 實測 gpt-4o-mini 翻泰文會翻一半停手，
          # 回出「ฉันอยาก吃ข้าว」這種中泰混雜的結果，逐詞拼音也會退回中文拼音。
          # 提示詞已寫得非常明確仍然如此，那是模型能力不足，不是講不清楚。
          # 泰文屬於相對冷門的語言，需要主力模型才撐得住。
          model: gpt-5.5
      audio:
        speech:
          # 語音設定採用扁平寫法。舊版的 audio.speech.options.* 巢狀形式已標記為棄用。
          #
          # 為什麼不用比較新的 gpt-4o-mini-tts：2026-08-14 發現它每一次呼叫都是
          # 重新合成一個講話的人，voice 只決定音色基底。結果是同一個音檔內聲線一致，
          # 但「5」和「晚餐」兩次查詢聽起來像兩個不同的人，句子越短飄得越明顯。
          #
          # 它的賣點是 instructions 參數（可指定語氣），但 Spring AI 2.0.0 的
          # OpenAiAudioSpeechOptions 只有 input / voice / response-format / speed 四個欄位，
          # 沒有開放 instructions，也沒有 seed。等於付了不穩定的代價卻拿不到好處。
          #
          # tts-1 是非生成式的舊款，同一個 voice 跨句子穩定，適合當發音範本。
          # 附帶好處：tts-1 按「字元」計價，跟 OpenAiSpeechClient 用 thaiText.length()
          # 記帳的方式完全一致，語音費用從粗估變成精確值。
          model: tts-1
          voice: alloy
          response-format: mp3

  data:
    web:
      pageable:
        # 分頁回應改用穩定的 DTO 結構輸出。
        # 直接序列化 PageImpl 的話，Spring 會警告「JSON 結構不保證穩定」——
        # 意思是升級版本時欄位可能改變，而前端正是靠這個結構在讀資料。
        serialization-mode: via-dto

  jpa:
    # 關閉 Open Session In View，避免在 View 層觸發非預期的延遲查詢。
    # 本專案不使用 JPA 關聯註解，資料一律在 Service 層查詢完畢後轉為 DTO。
    open-in-view: false
    hibernate:
      # 資料表結構以 SQL 腳本明確管理，不交由 Hibernate 自動產生。
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

ai:
  pricing:
    openai:
      # 單位是「每一個 token 的美金價格」。
      # 官網公布的是「每 100 萬 token 多少錢」，填進來要除以 1,000,000。
      # 查證日期 2026-08-13，來源 developers.openai.com/api/docs/pricing
      #
      # gpt-5.5：輸入 $5.00 / 1M、輸出 $30.00 / 1M
      # ★ 換模型時這兩個數字一定要跟著改，否則帳面數字是錯的。
      #   （2026-08-13 之前這裡放的是計畫文件的佔位值 0.000005 / 0.000015，
      #     而當時實際用的 gpt-4o-mini 是 0.00000015 / 0.0000006，
      #     費用被高估了三十幾倍。）
      translation-input-price: 0.00000500
      translation-output-price: 0.00003000

      # tts-1：$15.00 / 1M characters（查證日期 2026-08-14，來源同上）。
      # 這個模型本來就按字元計價，跟 OpenAiSpeechClient 用 thaiText.length() 記帳
      # 的方式完全一致，所以語音費用是精確值，不再是粗估。
      #
      # （2026-08-14 之前用的是 gpt-4o-mini-tts，那款按 token 收費、主要成本在
      #   語音輸出那段，我們量不到，當時的語音帳只能算粗估。換模型後這個問題消失。
      #   單價數字碰巧一樣是 0.000015，是巧合，不是沒改到。）
      speech-price: 0.00001500

speech:
  # 語音要用哪一家。GOOGLE / OPENAI，兩份實作都在，切這一行就換人。
  #
  # ★ 2026-08-15 從 OPENAI 換成 GOOGLE，原因是發音不道地：
  #   OpenAI 的聲音全部是拿英文訓練的，它沒有泰語發音模型，
  #   等於「用英文的嘴唸泰文」，ครับ 會唸成英文的 krab。
  #   Google 有 th-TH 的原生泰語聲音，腔調才對。
  #
  # ★ 只有「唸出來」換家，翻譯仍然是 OpenAI 的 gpt-5.5。
  provider: GOOGLE

google:
  speech:
    # 泰語男聲。th-TH 的男聲全部是 Chirp3-HD 系列（另外兩個非 Chirp 的都是女聲）。
    # 換聲音只要改這一行，可用清單見規格書。
    thai-voice: th-TH-Chirp3-HD-Charon

    # 中文用台灣華語的男聲。WaveNet 不是生成式的，跨句子穩定。
    chinese-voice: cmn-TW-Wavenet-B

    # 每一個字元的美金價格。
    # Chirp3-HD 屬於高階聲音，且每月有免費額度 ——
    # ★ 這個數字請依 Google 當下的定價頁確認後再填，填錯只會讓帳面失真，
    #   不影響功能。免費額度內實際上是 0 元。
    price-per-character: 0.00003000

    # 金鑰在 application-local.yml，不進版本控制。

audio:
  storage:
    # 音檔存到哪裡。LOCAL / GCS，兩份實作都在，切這一行就換人。
    #
    # ★ 與 speech.provider 是同一種設計。
    #   本機維持 LOCAL；雲端由 application-prod.yml 覆寫為 GCS。
    provider: LOCAL

    # 音檔存放資料夾。已列入 .gitignore，不進版本控制。
    # 底下會依語言再分 th/ 與 zh/ 兩個子資料夾。
    directory: audio

    # 查詢完成時自動產生哪些語言的音檔（涵蓋整句與多重說法）。
    #
    # 這是「總開關」，還有第二道規則寫在 TranslationService.autoGenerateAudio：
    # ★ 中文音檔只有在「使用者輸入泰文」時才會產生。
    #   那時中文是翻譯結果，需要聽它確認自己理解得對不對；
    #   使用者自己打中文進來時，唸他剛打的字給他聽沒有價值。
    #
    # 把 ZH 從這裡拿掉的話，中文音檔就完全不會自動產生（只能點擊產生）。
    auto-generate: [TH, ZH]

logging:
  level:
    root: info
